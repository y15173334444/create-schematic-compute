plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.181'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

base {
    archivesName = 'create-schematic-compute'
}

group = 'io.github.y15173334444'
// 单一真相源 = gradle.properties 的 mod_version（历史上双写漂移过：build.gradle 1.2.5.1 vs mod_version 1.2.5.2）
// Single source of truth = gradle.properties mod_version (the dual write already drifted once).
version = mod_version
runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'info'
        modSource sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.group
        // Multiplayer dev: -Pusername=Name sets player name
        if (project.hasProperty('username')) {
            arguments '--username', project.property('username').toString()
        }
        // Auto-join: -Pquickplay=host:port passes vanilla quick-play through
        if (project.hasProperty('quickplay')) {
            arguments '--quickPlayMultiplayer', project.property('quickplay').toString()
        }
    }

    client2 {
        runType 'client'
        systemProperty 'forge.enabledGameTestNamespaces', project.group
        // Multiplayer dev: -Pusername2=Name sets second player name
        if (project.hasProperty('username2')) {
            arguments '--username', project.property('username2').toString()
        } else {
            arguments '--username', 'Dev2'
        }
        // Auto-join: -Pquickplay=host:port (mirrors runClient) / 与 runClient 对称的自动进服
        if (project.hasProperty('quickplay')) {
            arguments '--quickPlayMultiplayer', project.property('quickplay').toString()
        }
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.group
        arguments '--nogui'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }           // Create
    maven { url = 'https://maven.tterrag.com' }              // Registrate, Flywheel
    maven { url = 'https://maven.moddinginquisition.org/releases' }
    flatDir {
        dirs 'libs'
    }
    // Create 6.0.10 从 Modrinth 拉取 —— 那是版权方自己的分发渠道，由它分发、我们拉取，
    // 好过把带 ARR 资产的 jar 提交进本仓库（仓库是公开的）。见 docs/third-party-licenses.md §3 O4。
    // Pulled from Modrinth, the authors' own channel, instead of committing the ARR-bearing
    // jar into this public repo. See docs/third-party-licenses.md §3 O4.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

// Sable 兼容性矩阵旋钮（配套 tools/sable-compat）：
// -PsableCompatDir=<dir> —— 用该目录下的 sable + companion jar 对替换 libs/ 里那对基线 jar，
//   编译/运行/测试 classpath 同步换；libs/ 里的 sable-*.jar 被排除，防止两份同名类撞车。
// -PsableVersionRange=[x,y) —— 覆盖 mods.toml 的 sable 依赖区间 token（实测某版本时免得
//   区间警告混进实测噪声）。两个都不传时行为与原先一致（libs/ 基线对 + gradle.properties 区间）。
// Sable compat-matrix knobs (see tools/sable-compat): -PsableCompatDir swaps the baseline
// sable + companion pair in libs/ for a candidate pair across the compile/runtime/test
// classpaths (the libs/ sable-*.jar entries are excluded so two copies of the same
// classes never collide); -PsableVersionRange overrides the mods.toml version-range
// token. With neither set, behaviour is unchanged.
def sableCompatDir = findProperty('sableCompatDir')?.toString()
def localJarTree = fileTree(dir: 'libs', include: '*.jar')
def sableJarTree = files()
if (sableCompatDir != null) {
    def candidateDir = file(sableCompatDir)
    if (!candidateDir.isDirectory()) {
        throw new GradleException("-PsableCompatDir is not a directory: ${sableCompatDir}")
    }
    localJarTree.exclude 'sable-*.jar'
    sableJarTree = fileTree(dir: candidateDir, include: '*.jar')
}
def sableVersionRangeEffective = findProperty('sableVersionRange')?.toString() ?: sable_version_range

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Create 走 Modrinth Maven：与原先 libs/ 里那份逐字节相同（SHA256 一致，19,123,767 B），
    // 所以 dev 运行行为不变，只是不再把带 ARR 资产的 jar 提交进公开仓库。
    // Create comes from Modrinth Maven — byte-identical to the jar that used to sit in libs/,
    // so dev runtime behaviour is unchanged; the ARR-bearing jar is simply no longer committed.
    // 注意：Modrinth 生成的 POM 不含 <dependencies>，所以 Flywheel / Ponder 必须继续由 libs/ 提供，
    // 编译期才看得到 dev.engine_room.flywheel.* 与 net.createmod.catnip.*。
    // Note: Modrinth's generated POM declares no dependencies, so Flywheel / Ponder must keep
    // coming from libs/ for the compile classpath.
    def createDep = "maven.modrinth:create:${create_maven_version}"
    compileOnly createDep
    runtimeOnly createDep

    // 其余本地 JAR 依赖（Flywheel / Ponder / Sable 等），仍需在编译期可见。
    // Remaining local JARs (Flywheel / Ponder / Sable, ...) still needed at compile time.
    // 注意：Sable 的依赖声明只存在于 neoforge.mods.toml（optional，运行期元数据），
    // NeoForge 语义下它不要求 build 侧同名依赖；这里 compileOnly/runtimeOnly 已覆盖
    // 开发环境的编译与运行 classpath，gradle.properties 的 sable_version_range 仅供资源替换。
    // Note: Sable's dependency declaration lives only in neoforge.mods.toml (optional,
    // runtime metadata); under NeoForge semantics it requires no matching build-side
    // dependency — the compileOnly/runtimeOnly lines below already cover the dev compile
    // and runtime classpaths, and gradle.properties' sable_version_range is just an
    // expansion token.
    compileOnly localJarTree
    runtimeOnly localJarTree
    compileOnly sableJarTree
    runtimeOnly sableJarTree

    // Test compilation also needs those jars (e.g. Create's IMergeableBE),
    // otherwise javac cannot resolve BE types referenced from src/test.
    // 测试编译同样需要这些 jar（如 Create 的 IMergeableBE），
    // 否则 javac 无法解析 src/test 引用的 BE 类型。
    testImplementation createDep
    testImplementation localJarTree
    testImplementation sableJarTree

    // Mixin AP for processing @Mixin annotations
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // Unit tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            create_version_range    : create_version_range,
            sable_version_range     : sableVersionRangeEffective,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// ── Rust native 库构建接线（R2，探索线 csc-rust-backend-explore）──────────────────
// cargo build --release 产 formula-native 的 cdylib（formula_native.dll 等），按
// natives/<os>-<arch>/ 打进 jar；Java 侧 FormulaNative 按**同一套映射**提取加载
// （os/arch → 目录名两端写死一致，改动必须双端同步）。cargo 不在 PATH（含 CI/无
// Rust 的机器）→ 跳过并打 warn，绝不 fail 构建——无 native 时 Java 解释器兜底。
// Rust native wiring (R2): cargo release build of the formula-native cdylib,
// packaged under natives/<os>-<arch>/ with the same mapping FormulaNative uses on
// the Java side (both sides must stay in lockstep). Missing cargo skips with a
// warning — the build never fails; the Java interpreter stays the fallback.
def nativeOs = {
    def n = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
    if (n.contains('windows')) return 'windows'
    if (n.contains('linux')) return 'linux'
    if (n.contains('mac os') || n.contains('darwin')) return 'macos'
    return null
}()
def nativeArch = {
    def a = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT)
    if (a == 'amd64' || a == 'x86_64') return 'x86_64'
    if (a == 'aarch64' || a == 'arm64') return 'aarch64'
    return a
}()
def nativeDirName = nativeOs == null ? null : "${nativeOs}-${nativeArch}"
// cdylib 产物名按平台（cargo [lib] name = formula_native）。/ cdylib file name per platform.
def nativeLibFileName = nativeOs == 'windows' ? 'formula_native.dll'
        : nativeOs == 'macos' ? 'libformula_native.dylib'
        : 'libformula_native.so'
def nativeCargoDir = file('native/formula-core')
def nativeTargetFile = file("native/formula-core/target/release/${nativeLibFileName}")
def nativesStagingRoot = layout.buildDirectory.dir('natives')

// 在 PATH（及 CARGO_HOME/bin）里找 cargo；找不到返回 null → 任务跳过打 warn。
// Locate cargo on PATH (then CARGO_HOME/bin); null = skip with a warning.
static String resolveCargo() {
    def isWindows = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('windows')
    def exe = isWindows ? 'cargo.exe' : 'cargo'
    def path = System.getenv('PATH')
    if (path != null) {
        for (def dir in path.split(File.pathSeparator)) {
            def f = new File(dir, exe)
            if (f.isFile()) return f.absolutePath
        }
    }
    def cargoHome = System.getenv('CARGO_HOME')
    if (cargoHome != null) {
        def f = new File(cargoHome, 'bin/' + exe)
        if (f.isFile()) return f.absolutePath
    }
    return null
}

tasks.register('buildNative') {
    group = 'build'
    description = 'Builds the formula_native cdylib via cargo --release (skipped with a warning when cargo is unavailable).'
    inputs.dir('native/formula-core/src')
    inputs.file('native/formula-core/Cargo.toml')
    inputs.file('native/formula-core/Cargo.lock')
    if (nativeDirName != null) {
        outputs.file(nativesStagingRoot.map { it.dir(nativeDirName).file(nativeLibFileName) })
    }
    doLast {
        def cargo = resolveCargo()
        if (cargo == null) {
            logger.warn('buildNative: cargo not found on PATH/CARGO_HOME — skipping formula_native build; jar ships without natives and FormulaNative.AVAILABLE stays false (Java interpreter fallback).')
            return
        }
        exec {
            workingDir nativeCargoDir
            commandLine cargo, 'build', '--release'
        }
        if (!nativeTargetFile.isFile()) {
            logger.warn("buildNative: cargo build finished but ${nativeTargetFile} is missing — nothing to package.")
            return
        }
        def stageDir = nativesStagingRoot.get().dir(nativeDirName).asFile
        copy {
            from nativeTargetFile
            into stageDir
        }
        logger.lifecycle("buildNative: packaged ${nativeDirName}/${nativeLibFileName} (${nativeTargetFile.length()} B)")
    }
}

if (nativeDirName != null) {
    // 未知平台（nativeDirName = null）不接线：jar 无 natives 目录，Java 侧按陌生平台兜底。
    // Unknown platforms skip the wiring entirely; the Java side falls back per its own mapping.
    tasks.named('processResources') {
        dependsOn tasks.named('buildNative')
        from(nativesStagingRoot) {
            into 'natives'
            include "${nativeDirName}/${nativeLibFileName}"
        }
    }
}

java {
    withSourcesJar()
}

// MIT 合规：许可文本随分发件进包——MIT 要求所有副本携带版权声明与许可文本，
// 1.0.0–1.2.5.2 的 jar 缺失（仅仓库根有 LICENSE），自此补齐。
// MIT compliance: the license text ships inside the distributed jars - MIT requires
// the copyright and permission notices in all copies; releases 1.0.0-1.2.5.2 carried
// none (repo root only), fixed from here on.
tasks.named('jar') {
    from('LICENSE') {
        into('META-INF')
        rename('LICENSE', 'LICENSE.txt')
    }
}
tasks.named('sourcesJar') {
    from('LICENSE') {
        into('META-INF')
        rename('LICENSE', 'LICENSE.txt')
    }
}
