[package]
name = "formula-core"
version = "0.1.0"
edition = "2021"

# libm 是唯一运行时依赖：纯 Rust fdlibm 移植（no_std、零原生链接），与 Java StrictMath
# 同源——三角/超越函数恢复与 Java 逐位一致（msvcrt 在 π/2 倍数附近的弱归约收口，
# 见 docs/rust-backend-exploration.md §5.3）。
# libm is the single runtime dependency: pure-Rust fdlibm port (no_std, no native
# linkage), same lineage as Java StrictMath — restores bit-exact parity.
# jni 只在 ffi.rs（R2 JNI shim）使用：cdylib 导出面，进程内不链接 JVM（符号由
# 加载方提供）。
# jni is only used by ffi.rs (the R2 JNI shim): the cdylib export surface; the
# JVM is never linked in — symbols come from the loading process.

[dependencies]
libm = "0.2"
jni = "0.21"

# lib 名 = cdylib 产物名（formula_native.dll / libformula_native.so / .dylib），
# 与 Java FormulaNative.LIB_NAME 及 gradle 打包路径（natives/<os>-<arch>/）三方一致。
# crate-type：cdylib = JNI 产物；rlib = cargo test / alloc-bench 的普通 Rust 库
# （测试经 lib 名引用，改名后 use 路径同步为 formula_native）。
# The lib name IS the cdylib artifact name, kept in lockstep with
# FormulaNative.LIB_NAME and the gradle packaging path; cdylib ships the JNI
# surface, rlib keeps cargo test / alloc-bench working as a normal Rust lib.
[lib]
name = "formula_native"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alloc-bench"
path = "src/bin/alloc_bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
