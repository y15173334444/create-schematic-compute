# Sable 依赖声明（P2-21）：仅声明于 neoforge.mods.toml（可选依赖，运行期元数据），
# build 侧无需坐标——libs/ 的 compileOnly/runtimeOnly fileTree 已覆盖开发环境 classpath。
# 区间下限 = libs 实测版本 1.2.2；上限收在 1.3 之前，让未验证的版本线（含 2.x 大版本）
# 在 NeoForge 模组列表/日志里显式报警，而不是 mixin 对着 Sable 内部包静默失效（P2-21 的病灶）。
# Sable dependency declaration (P2-21): declared only in neoforge.mods.toml (optional,
# runtime metadata); no build-side coordinates needed — the libs/ compileOnly/runtimeOnly
# fileTree already covers the dev classpath. Floor = the libs-verified 1.2.2; capped below
# 1.3 so untested lines (including a 2.x major jump) warn visibly in NeoForge's mod list /
# logs instead of mixins silently failing against Sable internals (the drift P2-21 targets).
sable_version_range = [1.2.2,1.3)

# Create 走 Modrinth Maven 拉取（版权方自己的分发渠道），不再随仓库分发其 ARR 资产。
# 与原先 libs/ 里那份逐字节相同：SHA256 EF87FE57…E37A，19,123,767 B。
# 见 docs/third-party-licenses.md §3 O4。
# Create is pulled from Modrinth Maven (the authors' own distribution channel) so its
# ARR assets are no longer redistributed in-repo. Byte-identical to the jar that used to
# live in libs/ (same SHA256).
create_maven_version = 6.0.10+mc1.21.1
