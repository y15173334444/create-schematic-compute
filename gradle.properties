# Sable 依赖声明（P2-21）：仅声明于 neoforge.mods.toml（可选依赖，运行期元数据），
# build 侧无需坐标——libs/ 的 compileOnly/runtimeOnly fileTree 已覆盖开发环境 classpath。
# 区间口径（2026-11-01 首轮版本矩阵后放宽）：下限保留 1.2.2 —— 1.2.2 起 plot 网格改
# 中心+本地坐标框架（v1.2.4.1 回归审计），更早版本链接得上但位姿语义不同；上限收在
# 2.1 之前 —— 1.x 与 2.0.x 线已过 tools/sable-compat 矩阵（链接点/全量重编/单测），
# 未验证的版本线仍显式报警而非 mixin 对着 Sable 内部包静默失效（P2-21 的病灶不复发）。
# 扩窗前先跑矩阵。
# Sable dependency declaration (P2-21): declared only in neoforge.mods.toml (optional,
# runtime metadata); no build-side coordinates needed — the libs/ compileOnly/runtimeOnly
# fileTree already covers the dev classpath. Range policy (widened 2026-11-01 after the
# first version matrix): floor stays 1.2.2 — the plot grid moved to the centre+local
# coordinate frame at 1.2.2 (v1.2.4.1 regression audit); earlier lines link fine but
# carry different pose semantics. Top stops before 2.1 — the 1.x and 2.0.x lines have
# passed the tools/sable-compat matrix (linkage / clean-rebuild compile / tests), and
# unverified lines still warn visibly in NeoForge's mod list / logs instead of mixins
# silently failing against Sable internals (the drift P2-21 targets). Re-run the matrix
# before extending.
sable_version_range = [1.2.2,2.1)

# Create 走 Modrinth Maven 拉取（版权方自己的分发渠道），不再随仓库分发其 ARR 资产。
# 与原先 libs/ 里那份逐字节相同：SHA256 EF87FE57…E37A，19,123,767 B。
# 见 docs/third-party-licenses.md §3 O4。
# Create is pulled from Modrinth Maven (the authors' own distribution channel) so its
# ARR assets are no longer redistributed in-repo. Byte-identical to the jar that used to
# live in libs/ (same SHA256).
create_maven_version = 6.0.10+mc1.21.1
