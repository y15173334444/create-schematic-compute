name: 功能需求 / Feature Request
description: 提一个新功能或改进 / Suggest a new feature or improvement
title: "[Feature]: "
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求描述 / What do you want?
      description: 想要什么能力？用一两句话描述 / The capability you want, in a sentence or two
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 动机与场景 / Motivation & scenario
      description: 在什么场景下解决什么问题？/ What problem does it solve, in what scenario?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案建议 / Proposal (optional)
      description: 如果有想法，描述你期望的形态；无想法可留空 / Describe the shape you have in mind, if any
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered (optional)
