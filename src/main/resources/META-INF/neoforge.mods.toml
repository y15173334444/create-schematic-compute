modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mixins]]
config = "create_schematic_compute.mixins.json"

[[mixins]]
config = "create_schematic_compute.sable.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "${mod_description}"
authors = "${mod_authors}"
logoFile = "icon.png"

    [[mods.dependencies]]
    modId = "minecraft"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "neoforge"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "create"
    versionRange = "${create_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    # 可选依赖（P2-21）：Sable 缺席时相关功能降级不崩（SableAbsenceTest 锚定），
    # 故 mandatory = false、ordering/side 照上方 create 条目的既有样式。
    # 区间口径（2026-11-01 首轮版本矩阵后放宽）：下限 1.2.2 —— 1.2.2 起 plot 网格改
    # 中心+本地坐标框架，更早版本链接得上但位姿语义不同；上限收在 2.1 之前 —— 1.x/2.0.x
    # 线已过 tools/sable-compat 矩阵（含 mixin 字符串目标 shouldCameraRotate 的链接点
    # 探针），未验证的版本线仍显式报警而非静默失效。开口向上会重现 P2-21 要诊断的版本
    # 漂移盲区；扩窗前先跑矩阵。
    # Optional dependency (P2-21): features degrade gracefully without Sable (anchored by
    # SableAbsenceTest), hence mandatory = false with ordering/side mirroring the create
    # entry above. Range policy (widened 2026-11-01 after the first version matrix): floor
    # = 1.2.2 — the plot grid moved to the centre+local coordinate frame at 1.2.2; earlier
    # lines link fine but carry different pose semantics. Capped below 2.1 — the 1.x/2.0.x
    # lines passed the tools/sable-compat matrix (incl. a linkage probe of the mixin string
    # target shouldCameraRotate), so unverified lines must warn visibly rather than fail
    # silently. An open top would recreate exactly the drift blind spot P2-21 exists to
    # diagnose; re-run the matrix before extending.
    [[mods.dependencies]]
    modId = "sable"
    versionRange = "${sable_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = false
